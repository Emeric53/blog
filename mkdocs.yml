site_name: Nullspace
site_author: Menglei Liang
site_description: 梁梦磊的个人博客：月记、生活、技术和分享。
site_url: https://emeric53.github.io/blog/

repo_name: Emeric53/blog
repo_url: https://github.com/Emeric53/blog
copyright: Copyright &copy; 2024 ~ now · Menglei Liang

theme:
  name: material
  language: zh
  custom_dir: overrides
  favicon: assets/images/favicon.svg
  icon:
    logo: material/circle-slice-8
    repo: fontawesome/brands/github
  features:
    - navigation.indexes
    - navigation.sections
    - content.code.copy
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: 进入夜晚
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: 回到白天
  font: false

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Emeric53
    - icon: fontawesome/solid/envelope
      link: mailto:todayislml@gmail.com
  # 我住过的地方。搬家时在末尾加一行：首页的天空、时间和天气会跟到新城市，
  # 之后写的文章落款也会变成新地名，以前的文章保持原样。
  places:
    - { since: 2024-01-01, name: 北京, lat: 39.90, lon: 116.40, tz: Asia/Shanghai }
    - { since: 2026-07-22, name: Albany, region: 纽约州, lat: 42.65, lon: -73.76, tz: America/New_York }
  # 最近在听：填上 Last.fm 用户名和 API key 后，首页和「片尾曲」会显示实时听歌记录。
  listening:
    lastfm_user: "Emeric77"
    lastfm_key: "1bd30dfa076bd45e0e0b6b0f4a23f0ce"
  giscus:
    repo: ""
    repo_id: ""
    category: "Comments"
    category_id: ""

plugins:
  - awesome-pages
  - blog:
      blog_dir: monthly
      post_url_format: "{slug}"
      post_readtime: false
      authors: false
      categories: false
      pagination_per_page: 200
  - blog:
      blog_dir: life
      post_url_format: "{slug}"
      post_readtime: false
      authors: false
      categories: false
      pagination_per_page: 200
  - tags
  - glightbox
  - minify:
      minify_html: true

hooks:
  - hooks/reading_time.py
  - hooks/recent_updates.py

extra_javascript:
  - https://cdn.jsdelivr.net/npm/pangu@4.0.7/dist/browser/pangu.min.js
  - javascripts/pangu_init.js
  - javascripts/sky.js

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true

exclude_docs: |
  technology/Math/

nav:
  - 首页: index.md
  - 月记: monthly/index.md
  - 生活: life/index.md
  - 技术: technology/index.md
  - 片尾曲: songs.md
  - 此刻: now.md
  - 关于: about.md
  - 标签: tags.md
