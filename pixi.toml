[workspace]
name = "emeric53-blog"
version = "0.1.0"
description = "Emeric53's personal writing and life archive"
authors = ["Emeric53"]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]

[dependencies]
python = "3.10.*"
cairo = ">=1.18.4,<2"

[tasks]
deploy = "PYTHONTZPATH=\"$PIXI_PROJECT_ROOT/.pixi/envs/default/share/zoneinfo\" python -m mkdocs gh-deploy --force"
# PYTHONDONTWRITEBYTECODE：避免 hook 生成 .pyc 触发 mkdocs serve 的重载循环
start = { cmd = "PYTHONTZPATH=\"$PIXI_PROJECT_ROOT/.pixi/envs/default/share/zoneinfo\" python -m mkdocs serve", env = { PYTHONDONTWRITEBYTECODE = "1" } }
build = "PYTHONTZPATH=\"$PIXI_PROJECT_ROOT/.pixi/envs/default/share/zoneinfo\" python -m mkdocs build"

[pypi-dependencies]
mkdocs-material = ">=9.7.1, <10"
mkdocs-awesome-pages-plugin = ">=2.10.1, <3"
pillow = ">=12.0.0, <13"
cairosvg = ">=2.8.2, <3"
mkdocs-git-revision-date-localized-plugin = ">=1.2.6, <2"
mkdocs-glightbox = ">=0.4.0, <1"
mkdocs-rss-plugin = ">=1.12.0, <2"
mkdocs-minify-plugin = ">=0.8.0, <1"
